user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with privacy protection (no query params containing tokens or mobile numbers)
    log_format privacy_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log privacy_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Security & Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=general_rate:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=otp_submit_rate:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=mcp_rate:10m rate=30r/s;

    # Max body size for uploaded age proof documents (5MB max)
    client_max_body_size 5M;

    upstream sewasetu_app {
        server app:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server: Redirect all traffic to HTTPS (except certbot acme challenge)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Production Secure Reverse Proxy
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS Certificates (Mounted from OpenStack Cinder / Let's Encrypt / State PKI)
        ssl_certificate /etc/nginx/ssl/live/sewasetu.crt;
        ssl_certificate_key /etc/nginx/ssl/live/sewasetu.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;

        # Health & Readiness Check Endpoints
        location ~ ^/(healthz|livez|readyz|api/health)$ {
            proxy_pass http://sewasetu_app;
            access_log off;
        }

        # 1. Citizen Model Context Protocol (Streamable HTTP SSE)
        location /mcp/citizen {
            limit_req zone=mcp_rate burst=15 nodelay;
            proxy_pass http://sewasetu_app/mcp/citizen;

            # Streamable HTTP / Server-Sent Events (SSE) requirements
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        # 2. Officer Model Context Protocol (Streamable HTTP SSE)
        location /mcp/officer {
            limit_req zone=mcp_rate burst=15 nodelay;
            proxy_pass http://sewasetu_app/mcp/officer;

            # Streamable HTTP / Server-Sent Events (SSE) requirements
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        # 3. OTP & Application Rate Limited Form Submissions
        location ~ ^/(apply|verify)$ {
            limit_req zone=otp_submit_rate burst=3 nodelay;
            proxy_pass http://sewasetu_app;

            # Kiosk Privacy: strictly prohibit caching of citizen PII
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
            add_header Pragma "no-cache" always;
        }

        # 4. General Portal Routes
        location / {
            limit_req zone=general_rate burst=20 nodelay;
            proxy_pass http://sewasetu_app;
        }
    }
}
