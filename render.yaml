services:
  - type: web
    name: sewasetu-ai
    env: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sewasetu-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: UPLOAD_DIR
        value: /var/sewasetu/uploads
      - key: SMS_GATEWAY_URL
        value: http://localhost:8025

databases:
  - name: sewasetu-db
    databaseName: sewasetu
    user: sewasetu
    plan: free
    region: singapore
