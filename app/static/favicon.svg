<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082442" />
      <stop offset="100%" stop-color="#0b3d6e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Outer Navy Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#f7931e" stroke-width="2.5" />

  <!-- Tricolor Arc border -->
  <!-- Saffron segment -->
  <path d="M 16 50 A 34 34 0 0 1 50 16" fill="none" stroke="#ff9933" stroke-width="4.5" stroke-linecap="round" />
  <!-- White segment -->
  <path d="M 50 16 A 34 34 0 0 1 84 50" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <!-- Green segment -->
  <path d="M 84 50 A 34 34 0 0 1 16 50" fill="none" stroke="#138808" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Ashoka Chakra -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" />
  <circle cx="50" cy="50" r="4.2" fill="url(#goldGrad)" />

  <!-- 12 Stylized Spokes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2">
    <line x1="50" y1="35" x2="50" y2="65" />
    <line x1="35" y1="50" x2="65" y2="50" />
    <line x1="39.4" y1="39.4" x2="60.6" y2="60.6" />
    <line x1="39.4" y1="60.6" x2="60.6" y2="39.4" />
    <line x1="42.5" y1="36.6" x2="57.5" y2="63.4" />
    <line x1="36.6" y1="42.5" x2="63.4" y2="57.5" />
  </g>

  <!-- Stylized Lions Crown Emblem -->
  <path d="M 37 32 L 42 22 L 47 32 Z" fill="url(#goldGrad)" />
  <path d="M 46 30 L 50 20 L 54 30 Z" fill="url(#goldGrad)" />
  <path d="M 53 32 L 58 22 L 63 32 Z" fill="url(#goldGrad)" />
  <rect x="36" y="32" width="28" height="3" rx="1.5" fill="url(#goldGrad)" />

  <!-- Stylized Base -->
  <rect x="34" y="69" width="32" height="3.5" rx="1.5" fill="#f7931e" />
  <rect x="30" y="73" width="40" height="2.5" rx="1" fill="#e2e8f0" />
</svg>
